name: Ошибка
description: Сервер падает, не находит справку, отдаёт неверные данные
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Не прикладывайте файлы справки и фрагменты её содержимого.**
        Справка платформы принадлежит правообладателю. Для разбора хватает
        имени книги, версии платформы и текста ошибки.
  - type: input
    id: version
    attributes:
      label: Версия сервера
      description: Вывод `itcoolmcplang1c --version`
      placeholder: 0.7.0 (abc1234, 2026-09-17)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Версия платформы 1С:Предприятие
      placeholder: 8.3.27.1936
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Операционная система
      options:
        - Windows
        - Linux
        - другая
    validations:
      required: true
  - type: dropdown
    id: lang
    attributes:
      label: Язык справки
      options:
        - ru
        - en
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Что вы сделали, что ожидали увидеть и что увидели вместо этого.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Журнал
      description: Запуск с `--log-level debug`. Вставьте относящиеся к делу строки.
      render: text
