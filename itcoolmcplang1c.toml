# Конфиг itcoolmcplang1c — ЗАПАСНОЙ вариант к аргументам запуска.
#
# Штатный запуск обходится аргументами: itcoolmcplang1c --platform-dir <BIN
# ПЛАТФОРМЫ> либо --data-dir <КАТАЛОГ ЗНАНИЙ> с готовым индексом. Этот файл
# кладётся в каталог знаний, рядом с data\ и prompts.json: сервер находит его
# сам, а относительные пути ниже разворачиваются от этого каталога.
# Без файла сервер поднимается на дефолтах — файл нужен только для того, что
# аргументами не задаётся. А вот файл, который положили и который не разобрался,
# — отказ старта: тихая подмена дефолтами обходится дороже опечатки.
#
# Приоритет по каждому ключу отдельно: аргумент > env > этот файл > дефолт.

[server]
# Транспорт. Значение одно — stdio: сервер работает с локально установленной
# платформой 1С, удалённым быть не может, и MCP-клиенты (Claude Desktop,
# Claude Code и другие) поднимают его дочерним процессом. HTTP-транспорт удалён.
# Прежние значения "http" и "both" — отказ старта, а не тихая подмена на stdio.
mode = "stdio"

[knowledge]
# Путь относительно каталога знаний. Без файла берётся ./data, а если его нет —
# сам каталог знаний (плоская раскладка). Аргумент --data-dir задаёт корень.
data_dir = "./data"

# Самосборка базы знаний из справки установленной платформы 1С.
# Включается сама, когда по data_dir готового индекса нет: готовый индекс всегда
# в приоритете, и пока он есть, платформа не читается вовсе.
#
# Каталог bin установки платформы. Закомментировано — значит автопоиск по
# стандартным местам (C:/Program Files/1cv8/<версия>/bin, /opt/1cv8/x86_64/<версия>);
# при нескольких версиях берётся старшая. Перекрывается аргументом --platform-dir.
# platform_dir = "C:/Program Files/1cv8/8.3.27.1936/bin"

# Язык справки: ru -> sh*_ru.hbk, en -> sh*_root.hbk. Выбор задаёт и файлы книг,
# и маркеры разбора страниц: заголовки разделов написаны на языке справки.
help_language = "ru"

# Версия платформы, когда её не вывести из пути (справка лежит не в <версия>/bin).
# platform_version = "8.3.27.1936"

[prompts]
# Путь относительно каталога знаний; перекрывается аргументом --prompts.
template_file = "./prompts.json"

[search]
max_results = 10
# Бусты для ранжирования
boost_title = 3.0
boost_keywords = 2.0

[logging]
level = "info"  # trace, debug, info, warn, error
format = "pretty"  # pretty, json, compact
